name: Desktop Native Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop-native/**'
      - '.github/workflows/desktop-native.yml'
  push:
    branches: [main]
    paths:
      - 'desktop-native/**'
      - '.github/workflows/desktop-native.yml'

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: desktop-native/**/*.csproj
      - run: dotnet restore desktop-native/tests/SahamLens.Tests/SahamLens.Tests.csproj
      - run: dotnet build desktop-native/tests/SahamLens.Tests/SahamLens.Tests.csproj -c Release --no-restore -p:BuildInParallel=false
      - run: dotnet test desktop-native/tests/SahamLens.Tests/SahamLens.Tests.csproj -c Release --no-build --maxcpucount:1

  winui-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: desktop-native/**/*.csproj
      - name: Restore WinUI
        run: dotnet restore desktop-native/src/SahamLens.WinUI/SahamLens.WinUI.csproj -r win-x64
      - name: Build WinUI
        run: dotnet build desktop-native/src/SahamLens.WinUI/SahamLens.WinUI.csproj -c Release -r win-x64 --no-restore -p:Platform=x64
      - name: Publish native x64
        run: dotnet publish desktop-native/src/SahamLens.WinUI/SahamLens.WinUI.csproj -c Release -r win-x64 --self-contained true --no-restore -p:Platform=x64 -o desktop-native/artifacts/win-x64
      - name: Smoke test native window
        shell: pwsh
        run: |
          $exe = Resolve-Path 'desktop-native/artifacts/win-x64/SahamLens.WinUI.exe'
          $process = Start-Process $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Native app exited early with code $($process.ExitCode)" }
            } while ($process.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
            if ($process.MainWindowHandle -eq 0) { throw 'Native WinUI window did not become ready' }
          } finally {
            if (Test-Path "$env:TEMP/SahamLens-Native-crash.txt") { Get-Content "$env:TEMP/SahamLens-Native-crash.txt" }
            if ($process.HasExited) {
              Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-3)} -ErrorAction SilentlyContinue |
                Where-Object { $_.Message -match 'SahamLens|WinUI|Microsoft.ui.xaml' } |
                Select-Object -First 10 TimeCreated, ProviderName, Id, LevelDisplayName, Message | Format-List
            }
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Build self-extracting installer
        shell: pwsh
        run: |
          Compress-Archive -Path 'desktop-native/artifacts/win-x64/*' -DestinationPath 'desktop-native/installer/payload.zip' -Force
          dotnet publish desktop-native/installer/SahamLens.Installer.csproj -c Release -r win-x64 --self-contained true -o desktop-native/artifacts/installer
          $built = Resolve-Path 'desktop-native/artifacts/installer/SahamLens-Native-Setup.exe'
          $target = (Resolve-Path 'desktop-native/artifacts').Path + '\SahamLens-Native-Setup.exe'
          Copy-Item $built $target -Force
          if (!(Test-Path $target)) { throw 'Installer EXE was not generated' }
          Get-FileHash $target -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: SahamLens-Native-win-x64
          path: |
            desktop-native/artifacts/win-x64/**
            desktop-native/artifacts/SahamLens-Native-Setup.exe
          if-no-files-found: error
