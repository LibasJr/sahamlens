name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `redesign/**` ikut dipicu karena PR ke base selain main TIDAK menjalankan CI sama
    # sekali - dan nol check terbaca persis seperti hijau di daftar PR (terukur PR #70,
    # 20 Agustus 2026). Visual Redesign V3 mendarat lewat sembilan PR ke redesign/v3.
    branches: [main, 'redesign/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # SELURUH gerbang statis, bukan tiga. Sebelumnya `verify:prod` merangkai sepuluh
      # pemeriksaan tapi CI hanya menjalankan tiga di antaranya - tujuh sisanya sudah
      # ditulis, sudah lulus, dan tidak menggerbang apa pun. Audit yang tidak dijalankan
      # otomatis akan berhenti dijalankan sama sekali dalam beberapa bulan.
      #
      # Kesepuluhnya jalan tanpa database maupun kredensial, jadi tidak ada alasan
      # ongkos untuk menyisakan sebagian.
      - name: Static integrity audits
        run: |
          npm run audit:schema
          npm run audit:cron
          npm run audit:ui
          npm run audit:performance
          npm run audit:manual-market
          npm run audit:market-labels
          npm run audit:risk-controls
          npm run audit:zero-dummy
          npm run audit:adoption
          npm run audit:a11y
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: typecheck-lint-test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Production build gate
        run: npm run build
        env:
          NODE_ENV: production
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
          APP_URL: https://sahamlens.id
          NEXT_PUBLIC_APP_URL: https://sahamlens.id
          NEXT_PUBLIC_TESTING_OPEN_ACCESS: ${{ vars.NEXT_PUBLIC_TESTING_OPEN_ACCESS || 'true' }}

      # Harus SETELAH build - skrip ini mengukur .next/static/chunks yang baru dihasilkan.
      # Tanpa direktori itu ia melewati diri sendiri, jadi urutannya bukan sekadar rapi:
      # menaruhnya lebih awal membuatnya lulus tanpa memeriksa apa pun.
      - name: Bundle size budget
        run: npm run audit:bundle

  # Pengukuran responsif sungguhan (utang 6, catatan redesign v2). Job TERPISAH, bukan
  # bagian dari verify:prod: ia menuntut unduhan browser, dan menyatukannya akan membuat
  # gerbang lokal butuh Chromium untuk memeriksa hal-hal yang tidak ada hubungannya.
  #
  # Tidak `needs:` job lain - ia tidak memakai hasil build maupun database, jadi
  # menjalankannya paralel memberi hasilnya lebih cepat tanpa menahan apa pun.
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # --only-shell: harness ini tidak pernah membuka aplikasi sungguhan, jadi headless
      # shell sudah cukup dan unduhannya jauh lebih kecil daripada Chromium penuh.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:responsive

  # Backend beku selama Visual Redesign V3. Hanya berjalan untuk PR yang menargetkan
  # branch redesign - PR biasa ke main memang boleh menyentuh backend.
  frontend-only:
    if: startsWith(github.base_ref, 'redesign/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run audit:frontend-only
        env:
          FRONTEND_ONLY_BASE: origin/${{ github.base_ref }}
