name: Build SahamLens Pro Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['desktop-v*']
    paths:
      - 'desktop/**'
      - 'desktop-web/**'
      - 'app/**'
      - 'components/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-pro.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'desktop-web/**'
      - 'app/**'
      - 'components/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-pro.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'

      - name: Install web dependencies
        working-directory: .
        run: npm ci

      - name: Install desktop dependencies
        run: npm ci

      - name: Build Tauri Desktop (.exe / .msi)
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        run: npx @tauri-apps/cli build

      - name: Build and publish desktop release
        if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: 'SahamLens Pro Desktop v__VERSION__'
          releaseBody: 'Frontend SahamLens dibundel langsung di aplikasi desktop. Data dan login tetap terhubung aman ke API SahamLens.'
          releaseDraft: false
          prerelease: false

      - name: Smoke-test NSIS install lifecycle
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS install failed: $($install.ExitCode)" }
          $installRoot = Join-Path $env:LOCALAPPDATA 'SahamLens Desktop'
          $uninstaller = Get-Item (Join-Path $installRoot 'Uninstall.exe') -ErrorAction SilentlyContinue
          if (-not $uninstaller -or -not (Test-Path $uninstaller.FullName)) { throw "Installed uninstaller not found" }
          $app = Get-ChildItem $installRoot -Filter '*.exe' |
            Where-Object Name -NE 'Uninstall.exe' | Select-Object -First 1
          if (-not $app -or -not (Test-Path $app.FullName)) { throw "Installed executable not found" }
          $process = Start-Process -FilePath $app.FullName -PassThru
          try { $null = $process.WaitForInputIdle(30000) } catch { }
          if ($process.HasExited) { throw "Installed executable exited during launch smoke test" }
          $null = $process.CloseMainWindow()
          if (-not $process.WaitForExit(15000)) { Stop-Process -Id $process.Id -Force }

      - name: Cleanup NSIS smoke install
        if: ${{ always() }}
        shell: pwsh
        run: |
          $uninstaller = Get-Item (Join-Path $env:LOCALAPPDATA 'SahamLens Desktop/Uninstall.exe') -ErrorAction SilentlyContinue
          if ($uninstaller -and (Test-Path $uninstaller.FullName)) {
            $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstall failed: $($uninstall.ExitCode)" }
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SahamLens-Pro-Windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/sahamlens-desktop-pro.exe
          if-no-files-found: error
