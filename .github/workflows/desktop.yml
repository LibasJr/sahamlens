name: Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --prefix desktop
      - run: npm run tauri:build --prefix desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
      - uses: actions/upload-artifact@v4
        with:
          name: SahamLens-windows-installer
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
