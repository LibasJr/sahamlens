name: Deploy VPS

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: sahamlens-production-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    runs-on: ubuntu-latest

    steps:
      # PERBAIKAN 2026-08-12. Sebelumnya `env:` dan `run:` langkah ini menjorok 2 spasi -
      # lebih dangkal daripada `steps:` sendiri - sehingga SELURUH file gagal di-parse.
      # Gejalanya menyesatkan: run muncul bernama ".github/workflows/deploy-vps.yml"
      # (bukan "Deploy VPS") dengan NOL job, jadi tidak ada log langkah yang bisa dibaca
      # dan tidak ada satu pun pesan yang menyebut indentasi.
      - name: Periksa secret sebelum menyentuh SSH
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          # Hanya ada/tidaknya yang dicetak - tidak pernah nilainya.
          missing=0

          if [ -z "$VPS_SSH_KEY_B64" ] && [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Kunci deploy belum diisi. Set SALAH SATU: VPS_SSH_KEY_B64 (disarankan) atau VPS_SSH_KEY."
            missing=1
          else
            [ -n "$VPS_SSH_KEY_B64" ] && echo "VPS_SSH_KEY_B64: terisi"
            [ -n "$VPS_SSH_KEY" ] && echo "VPS_SSH_KEY: terisi"
          fi

          for name in VPS_KNOWN_HOSTS VPS_HOST; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name belum diisi di Settings > Secrets and variables > Actions"
              missing=1
            else
              echo "$name: terisi"
            fi
          done

          # VPS_PORT opsional. Sebelumnya kosongnya berbahaya: `ssh -p ""` membuat ssh
          # menelan argumen berikutnya sebagai nomor port.
          if [ -z "$VPS_PORT" ]; then
            echo "VPS_PORT: kosong, memakai 22"
          else
            echo "VPS_PORT: terisi"
          fi

          [ "$missing" = "0" ] || exit 1

      - name: Siapkan SSH
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Base64 didahulukan: secret multi-baris rentan kehilangan/berubah akhiran baris,
          # dan kunci OpenSSH menolak dimuat kalau barisnya rusak sedikit saja.
          if [ -n "$VPS_SSH_KEY_B64" ]; then
            if ! printf '%s' "$VPS_SSH_KEY_B64" | tr -d '[:space:]' | base64 -d > "$HOME/.ssh/sahamlens_deploy" 2>/dev/null; then
              echo "::error::VPS_SSH_KEY_B64 bukan base64 yang sah. Buat ulang dengan: base64 -w0 < ~/.ssh/id_ed25519   (macOS: base64 -i ~/.ssh/id_ed25519)"
              exit 1
            fi
          else
            printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/sahamlens_deploy"
          fi
          chmod 600 "$HOME/.ssh/sahamlens_deploy"

          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          # Kunci yang pernah lewat editor Windows membawa CRLF; OpenSSH menolaknya dengan
          # "invalid format" yang tidak menunjuk ke penyebabnya sama sekali.
          sed -i 's/\r$//' "$HOME/.ssh/sahamlens_deploy" "$HOME/.ssh/known_hosts"

          # Inilah baris yang menggagalkan run 31597396135 dengan exit code 1 - tanpa satu
          # kalimat pun yang menjelaskan kenapa. Sekarang alasannya ditulis.
          if ! ssh-keygen -y -f "$HOME/.ssh/sahamlens_deploy" > /dev/null 2>&1; then
            echo "::error::Isi secret bukan private key OpenSSH yang sah. Yang dibutuhkan SELURUH file kunci PRIVAT (termasuk baris BEGIN dan END) - bukan kunci publik (.pub), bukan format PuTTY (.ppk), dan bukan kunci yang dilindungi passphrase (BatchMode tidak bisa mengetiknya)."
            exit 1
          fi
          echo "Private key sah."

          if ! grep -qE '^[^#[:space:]]+ +(ssh-|ecdsa-)' "$HOME/.ssh/known_hosts"; then
            echo "::error::VPS_KNOWN_HOSTS tidak berisi baris host key yang sah. Isi dengan keluaran: ssh-keyscan -p <PORT> <HOST>"
            exit 1
          fi
          echo "known_hosts sah."

      - name: Deploy SahamLens ke VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"
          set +e
          ssh \
            -i "$HOME/.ssh/sahamlens_deploy" \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            lens@"$VPS_HOST" deploy
          code=$?
          set -e

          # Kode keluar SSH punya arti spesifik. Tanpa terjemahan ini setiap kegagalan
          # tampil sama saja: satu tanda merah tanpa keterangan.
          case "$code" in
            0)   echo "Deploy selesai." ;;
            127) echo "::error::Perintah 'deploy' tidak ada di PATH user lens. Catatan penting: ALIAS di ~/.bashrc TIDAK berlaku untuk ssh non-interaktif - perintahnya harus skrip yang bisa dieksekusi (mis. /usr/local/bin/deploy), atau tulis path lengkapnya di workflow ini." ;;
            255) echo "::error::Koneksi/otentikasi SSH gagal. Urutan cek: host & port benar; kunci PUBLIK pasangannya ada di ~lens/.ssh/authorized_keys; VPS_KNOWN_HOSTS cocok dengan host key server SAAT INI (berubah kalau server dibangun ulang)." ;;
            *)   echo "::error::Skrip deploy di VPS keluar dengan kode $code - kegagalannya DI SERVER, bukan di koneksinya. Periksa log skrip deploy di VPS." ;;
          esac
          exit "$code"
