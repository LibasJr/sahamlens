name: Deploy VPS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: sahamlens-production-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout untuk verifikasi manual
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6

      - name: Setup Node untuk verifikasi manual
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependency untuk verifikasi manual
        if: github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Production gate untuk deploy manual
        if: github.event_name == 'workflow_dispatch'
        run: npm run verify:prod
        env:
          NODE_ENV: production
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
          APP_URL: https://sahamlens.id
          NEXT_PUBLIC_APP_URL: https://sahamlens.id
          NEXT_PUBLIC_TESTING_OPEN_ACCESS: ${{ vars.NEXT_PUBLIC_TESTING_OPEN_ACCESS || 'true' }}

      - name: Pilih jalur SSH dan periksa secret
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_CF_SSH_HOST: ${{ secrets.VPS_CF_SSH_HOST }}
          VPS_CF_KNOWN_HOSTS: ${{ secrets.VPS_CF_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$VPS_SSH_KEY_B64" ] && [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Set VPS_SSH_KEY_B64 (disarankan) atau VPS_SSH_KEY."
            missing=1
          fi

          if [ -n "$VPS_CF_SSH_HOST" ]; then
            echo "SSH transport: Cloudflare Tunnel"
            [ -n "$VPS_CF_KNOWN_HOSTS" ] || { echo "::error::VPS_CF_KNOWN_HOSTS wajib saat VPS_CF_SSH_HOST dipakai."; missing=1; }
            echo "DEPLOY_HOST=$VPS_CF_SSH_HOST" >> "$GITHUB_ENV"
            echo "DEPLOY_PORT=22" >> "$GITHUB_ENV"
            echo "DEPLOY_VIA_TUNNEL=true" >> "$GITHUB_ENV"
          else
            echo "SSH transport: direct/legacy"
            [ -n "$VPS_HOST" ] || { echo "::error::VPS_HOST belum diisi."; missing=1; }
            [ -n "$VPS_KNOWN_HOSTS" ] || { echo "::error::VPS_KNOWN_HOSTS belum diisi."; missing=1; }
            echo "DEPLOY_HOST=$VPS_HOST" >> "$GITHUB_ENV"
            echo "DEPLOY_PORT=${VPS_PORT:-22}" >> "$GITHUB_ENV"
            echo "DEPLOY_VIA_TUNNEL=false" >> "$GITHUB_ENV"
          fi
          [ "$missing" = 0 ] || exit 1

      - name: Siapkan SSH
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_CF_KNOWN_HOSTS: ${{ secrets.VPS_CF_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" "$HOME/bin"
          chmod 700 "$HOME/.ssh"
          if [ -n "$VPS_SSH_KEY_B64" ]; then
            printf '%s' "$VPS_SSH_KEY_B64" | tr -d '[:space:]' | base64 -d > "$HOME/.ssh/sahamlens_deploy"
          else
            printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/sahamlens_deploy"
          fi
          chmod 600 "$HOME/.ssh/sahamlens_deploy"
          if [ "$DEPLOY_VIA_TUNNEL" = "true" ]; then
            printf '%s\n' "$VPS_CF_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            curl -fsSL --retry 3 --connect-timeout 15 \
              https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
              -o "$HOME/bin/cloudflared"
            chmod 700 "$HOME/bin/cloudflared"
            "$HOME/bin/cloudflared" --version
          else
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          sed -i 's/\r$//' "$HOME/.ssh/sahamlens_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/sahamlens_deploy" >/dev/null
          grep -qE '^[^#[:space:]]+ +(ssh-|ecdsa-)' "$HOME/.ssh/known_hosts"

      - name: Deploy SahamLens ke VPS
        run: |
          set +e
          proxy=()
          if [ "$DEPLOY_VIA_TUNNEL" = "true" ]; then
            proxy=(-o "ProxyCommand=$HOME/bin/cloudflared access ssh --hostname %h")
          fi
          ssh \
            -i "$HOME/.ssh/sahamlens_deploy" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            "${proxy[@]}" \
            lens@"$DEPLOY_HOST" deploy
          code=$?
          set -e
          case "$code" in
            0) echo "Deploy selesai." ;;
            127) echo "::error::Perintah 'deploy' tidak ada di PATH non-interaktif user lens." ;;
            255) echo "::error::Transport/otentikasi SSH gagal. Periksa hostname, known_hosts, key, dan konfigurasi Tunnel." ;;
            *) echo "::error::Skrip deploy VPS keluar dengan kode $code." ;;
          esac
          exit "$code"

      - name: Smoke test publik setelah deploy
        env:
          BASE_URL: https://sahamlens.id
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.BASE_URL;
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));
          async function get(path, attempts = 8) {
            let last;
            for (let i = 1; i <= attempts; i++) {
              try {
                const res = await fetch(base + path, { redirect: 'follow', signal: AbortSignal.timeout(12000) });
                const body = await res.text();
                if (res.ok) return { res, body };
                last = new Error(`${path} HTTP ${res.status}`);
              } catch (e) { last = e; }
              await sleep(i * 3000);
            }
            throw last;
          }
          const health = await get('/api/health');
          const parsed = JSON.parse(health.body);
          if (parsed?.checks?.database !== 'ok') throw new Error('Smoke: database health bukan ok');
          await get('/home');
          console.log('SMOKE PASS: /api/health + /home dapat dilayani dari luar VPS.');
          NODE
