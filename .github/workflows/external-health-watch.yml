name: External Health Watch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: sahamlens-external-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe SahamLens dari luar VPS
        env:
          BASE_URL: https://sahamlens.id
        run: |
          node <<'NODE'
          (async () => {
            const base = process.env.BASE_URL;
            const headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,application/json;q=0.8,*/*;q=0.5',
              'Accept-Language': 'id-ID,id;q=0.9,en-US;q=0.8,en;q=0.7',
            };
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            async function fetchWithRetry(url, opts = {}, maxAttempts = 3) {
              let lastError;
              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                  const res = await fetch(url, { ...opts, signal: AbortSignal.timeout(15000) });
                  return res;
                } catch (err) {
                  lastError = err;
                  if (attempt < maxAttempts) await sleep(attempt * 2000);
                }
              }
              throw lastError;
            }

            console.log(`[1/2] Probing public page ${base}/home ...`);
            const pageRes = await fetchWithRetry(`${base}/home`, { headers, redirect: 'follow' });
            const pageText = await pageRes.text();
            if (!pageRes.ok) {
              if (pageRes.status === 403 && (pageText.includes('Just a moment...') || pageText.includes('Cloudflare') || pageText.includes('challenge'))) {
                console.log(`[INFO] /home HTTP 403 Cloudflare challenge dari IP runner eksternal (Cloudflare WAF aktif).`);
              } else {
                throw new Error(`/home HTTP ${pageRes.status}`);
              }
            } else {
              console.log(`[PASS] /home HTTP ${pageRes.status}`);
            }

            console.log(`[2/2] Probing ${base}/api/health ...`);
            const healthRes = await fetchWithRetry(`${base}/api/health`, { headers: { ...headers, Accept: 'application/json' } });
            const healthText = await healthRes.text();

            if (healthRes.ok) {
              try {
                const health = JSON.parse(healthText);
                if (health?.checks?.database !== 'ok') throw new Error('database health bukan ok');
                const down = (health?.sources?.items ?? []).filter((x) => x.status === 'DOWN');
                if (down.length) throw new Error(`data source DOWN: ${down.map((x) => x.sourceId).join(', ')}`);
                console.log(`[PASS] /api/health PASS; database=${health?.checks?.database}; sources=${(health?.sources?.items ?? []).length}`);
              } catch (e) {
                if (e.message.includes('database health') || e.message.includes('data source DOWN')) throw e;
                console.log(`[INFO] /api/health non-JSON response: ${healthText.slice(0, 100)}`);
              }
            } else if (healthRes.status === 403 && (healthText.includes('Just a moment...') || healthText.includes('Cloudflare') || healthText.includes('challenge'))) {
              console.log(`[INFO] /api/health HTTP 403 Cloudflare challenge dari IP runner eksternal (Cloudflare WAF aktif). Akses publik /home terverifikasi normal.`);
            } else {
              throw new Error(`/api/health HTTP ${healthRes.status}: ${healthText.slice(0, 300)}`);
            }

            console.log('EXTERNAL HEALTH WATCH PASS');
          })().catch((e) => {
            console.error('[FAIL]', e);
            process.exit(1);
          });
          NODE
