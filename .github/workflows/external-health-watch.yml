name: External Health Watch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: sahamlens-external-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe SahamLens dari luar VPS
        env:
          BASE_URL: https://sahamlens.id
        run: |
          node <<'NODE'
          (async () => {
            const base = process.env.BASE_URL;
            const headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,application/json;q=0.8,*/*;q=0.5',
              'Accept-Language': 'id-ID,id;q=0.9,en-US;q=0.8,en;q=0.7',
            };
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            async function fetchWithRetry(url, opts = {}, maxAttempts = 3) {
              let lastError;
              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                  const res = await fetch(url, { ...opts, signal: AbortSignal.timeout(15000) });
                  return res;
                } catch (err) {
                  lastError = err;
                  if (attempt < maxAttempts) await sleep(attempt * 2000);
                }
              }
              throw lastError;
            }

            console.log(`[1/2] Probing public page ${base}/ ...`);
            const pageRes = await fetchWithRetry(`${base}/`, { headers, redirect: 'follow' });
            const pageText = await pageRes.text();
            if (!pageRes.ok) {
              if (pageRes.status === 403 && (pageText.includes('Just a moment...') || pageText.includes('Cloudflare') || pageText.includes('challenge'))) {
                console.log(`[INFO] / HTTP 403 Cloudflare challenge dari IP runner eksternal (Cloudflare WAF aktif).`);
              } else {
                throw new Error(`/ HTTP ${pageRes.status}`);
              }
            } else if (!pageText.includes('<h1')) {
              // Status saja tidak cukup. Sebelum ini probe menembak /home, yang membalas
              // HTTP 200 berisi cangkang redirect (meta-refresh + NEXT_REDIRECT) tanpa
              // konten sama sekali - jadi beranda bisa mati total dan probe tetap hijau.
              // Satu penanda konten membuat 200 berarti "beranda benar-benar terender".
              throw new Error('/ HTTP 200 tapi tidak merender <h1> - kemungkinan halaman kosong/stub');
            } else {
              console.log(`[PASS] / HTTP ${pageRes.status} dan merender konten`);
            }

            console.log(`[2/2] Probing ${base}/api/health ...`);
            const healthRes = await fetchWithRetry(`${base}/api/health`, { headers: { ...headers, Accept: 'application/json' } });
            const healthText = await healthRes.text();

            // 503 BUKAN "endpoint rusak" - itu jawaban health yang sah dan justru yang
            // paling perlu dibaca isinya. Sejak 2026-08-25 /api/health membalas 503 kalau
            // Redis tidak tersedia di produksi (kuota harian & rate limit fail-open tanpa
            // Redis - lihat app/api/health/route.ts). Kalau 503 jatuh ke cabang terakhir
            // di bawah, probe ini gagal dengan "HTTP 503" mentah yang tidak menyebut
            // penyebabnya, dan operator harus membuka endpoint-nya sendiri untuk tahu apa
            // yang rusak. Payload-nya sudah menyebutkan itu; tinggal dibaca.
            if (healthRes.ok || healthRes.status === 503) {
              let health;
              try {
                health = JSON.parse(healthText);
              } catch {
                // Non-JSON pada 503 berarti yang menjawab bukan aplikasi (proxy/WAF),
                // dan itu tetap kegagalan - beda dari non-JSON pada 200 yang sudah lama
                // diperlakukan informatif saja.
                if (!healthRes.ok) throw new Error(`/api/health HTTP ${healthRes.status} non-JSON: ${healthText.slice(0, 200)}`);
                console.log(`[INFO] /api/health non-JSON response: ${healthText.slice(0, 100)}`);
                health = null;
              }

              if (health) {
                if (health?.checks?.database !== 'ok') throw new Error('database health bukan ok');
                const down = (health?.sources?.items ?? []).filter((x) => x.status === 'DOWN');
                if (down.length) throw new Error(`data source DOWN: ${down.map((x) => x.sourceId).join(', ')}`);

                // Sampai di sini database sehat dan tidak ada sumber DOWN, jadi 503 hanya
                // bisa datang dari komponen lain yang didaftar `degraded` - hari ini Redis.
                const degraded = health?.degraded ?? [];
                if (!healthRes.ok) {
                  throw new Error(`/api/health HTTP ${healthRes.status} - terganggu: ${degraded.length ? degraded.join(', ') : 'penyebab tidak disebutkan payload'}`);
                }
                console.log(`[PASS] /api/health PASS; database=${health?.checks?.database}; redis=${health?.checks?.redis}; sources=${(health?.sources?.items ?? []).length}`);
              }
            } else if (healthRes.status === 403 && (healthText.includes('Just a moment...') || healthText.includes('Cloudflare') || healthText.includes('challenge'))) {
              console.log(`[INFO] /api/health HTTP 403 Cloudflare challenge dari IP runner eksternal (Cloudflare WAF aktif). Akses publik / terverifikasi normal.`);
            } else {
              throw new Error(`/api/health HTTP ${healthRes.status}: ${healthText.slice(0, 300)}`);
            }

            console.log('EXTERNAL HEALTH WATCH PASS');
          })().catch((e) => {
            console.error('[FAIL]', e);
            process.exit(1);
          });
          NODE
