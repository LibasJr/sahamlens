name: External Health Watch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: sahamlens-external-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe SahamLens dari luar VPS
        env:
          BASE_URL: https://sahamlens.id
        run: |
          node <<'NODE'
          (async () => {
            const base = process.env.BASE_URL;
            const healthRes = await fetch(base + '/api/health', { signal: AbortSignal.timeout(15000) });
            const healthText = await healthRes.text();
            if (!healthRes.ok) throw new Error(`/api/health HTTP ${healthRes.status}: ${healthText.slice(0, 300)}`);
            const health = JSON.parse(healthText);
            if (health?.checks?.database !== 'ok') throw new Error('database health bukan ok');
            const down = (health?.sources?.items ?? []).filter((x) => x.status === 'DOWN');
            if (down.length) throw new Error(`data source DOWN: ${down.map((x) => x.sourceId).join(', ')}`);
            const pageRes = await fetch(base + '/home', { redirect: 'follow', signal: AbortSignal.timeout(15000) });
            if (!pageRes.ok) throw new Error(`/home HTTP ${pageRes.status}`);
            console.log(`EXTERNAL HEALTH PASS; sources=${(health?.sources?.items ?? []).length}`);
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
