[package]
name = "sahamlens-desktop"
version = "0.1.0"
description = "SahamLens desktop research client"
authors = ["SahamLens"]
edition = "2021"

[lib]
name = "sahamlens_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-stronghold = "2"
tauri-plugin-http = { version = "2.6.0", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
