# Drop-in journald untuk VPS SahamLens.
#
# Tanpa batas eksplisit journald memakai sampai 10% ukuran filesystem, dan di VPS satu box
# yang juga menampung Postgres cache, build .next, serta image Docker, itu ruang yang tidak
# tersedia. Lihat deploy/logrotate/README.md untuk alasan angkanya.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=512M
SystemKeepFree=1G
SystemMaxFileSize=64M
MaxRetentionSec=14day
